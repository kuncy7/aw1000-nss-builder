# Qualcommax NSS Builder — fork configuration.
#
# *** EXPERIMENTAL BRANCH: test-edma-nss ***
# Full AW1000 build (package parity with the qosmio production build on main)
# against Julius Bairaktaris' EDMA-NSS rework: NSS hardware offload running on
# OpenWrt main's upstream qca-edma/qca-ppe drivers instead of the vendor
# qca-nss-dp/qca-ssdk stack.
# Tree:  https://github.com/JuliusBairaktaris/openwrt-nss-edma/wiki
#
# Produces initramfs (USB/RAM boot, safe) AND sysupgrade images. Triggered
# manually only (workflow_dispatch) — push/schedule fire on main exclusively.
# Do not merge to main.

# Upstream OpenWrt source (the tree that will be checked out and built).
upstream:
  repo: JuliusBairaktaris/openwrt-nss-edma
  branch: nss-edma-rework

# NSS packages source. Tracked separately so we can detect package-only updates.
nss_packages:
  repo: JuliusBairaktaris/nss-packages
  branch: edma-nss

# Device id. Must match a directory under devices/<id>/ containing
#   - config        (the OpenWrt .config file)
#   - files/        (overlay rootfs, optional)
device: arcadyan_aw1000

# Custom feeds appended to feeds.conf during build. Order matters:
#   - nss MUST stay first — the first `feeds install` wins for duplicate
#     package names, and the NSS core (qca-nss-drv/ecm, sqm-scripts-nss in its
#     EDMA flavour) must come from the Julius feed.
#   - wwan (qosmio nss-packages, wwan branch) also carries its own NSS core
#     copies; prepare-build.sh installs ONLY the modem packages from it
#     (quectel-cm, luci-proto-quectel, rmnet-nss, mhi-pcie, qmi-wwan-quectel).
#   - sqm_nss (production main) is intentionally absent: the EDMA-adapted
#     sqm-scripts-nss ships in the nss feed.
# Each entry becomes:  src-git <name> <url>
feeds:
  - name: nss
    url: https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss
  # Modem packages. xhikarishii's aw1000-nss branch forks qosmio's wwan branch
  # at the exact commit we used to pin (af86012) and adds the cellular work
  # qosmio has not merged yet (PR qosmio/nss-packages#75, still open): split /
  # standalone IPv6 PDP, dual-stack profile export, routes flushed on reconnect,
  # apn6->apn fallback, a rewritten quectel.sh protocol handler and the
  # nat64/PREF64 RA hook. Named after this device. Our own patches still apply
  # on top (verified): the CGACT race, the rmnet->NSS deferred attach and the
  # 6.18 ports — he does not touch quectel-qmi-wwan, rmnet-nss or mhi-pcie.
  - name: wwan
    url: https://github.com/xhikarishii/nss-packages.git;aw1000-nss
  # wwand — event-driven QMI/MBIM/NCM connection manager (ucode). Carried for
  # evaluation next to quectel-cm, which stays the default: the two coexist,
  # migration is user-triggered. Its wwand-datapath-rmnet_nss add-on adopts the
  # QMAP children the vendor qmi_wwan_q registers, which is the only way a
  # dialer can keep our NSS offload — written by the author after we described
  # the rmnet_nss_callbacks contract on the forum.
  - name: ddimension
    url: https://github.com/ddimension/openwrt-repo.git
  - name: qosmio
    url: https://github.com/qosmio/packages-extra
  - name: iceg_modemdata
    url: https://github.com/4IceG/luci-app-modemdata
  - name: iceg_modemband
    url: https://github.com/4IceG/luci-app-modemband
  - name: iceg_sms_tool
    url: https://github.com/4IceG/luci-app-sms-tool-js
  - name: iceg_atinout
    url: https://github.com/4IceG/luci-app-atinout
  - name: modemfeed
    url: https://github.com/kuncy7/modemfeed.git
  - name: iceg_3ginfo_lite
    url: https://github.com/4IceG/luci-app-3ginfo-lite
  - name: iceg_lite_watchdog
    url: https://github.com/4IceG/luci-app-lite-watchdog
  - name: gspot_cpu
    url: https://github.com/kuncy7/luci-gspot-feeds
  - name: obsy_packages
    url: https://github.com/obsy/packages
  - name: obsy_modemdata
    url: https://github.com/obsy/modemdata
  - name: obsy_modemband
    url: https://github.com/obsy/modemband

# Release publishing settings.
release:
  prefix: aw1000-edma-test       # tag = <prefix>-<UTC timestamp>-<run id>
  keep: 3                        # number of newest releases to retain (older ones are deleted)
  artifact_retention_days: 7     # how long the GitHub Actions artifact (separate from the release) is kept
